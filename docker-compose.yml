services:
  postgres:
    image: postgres:17
    container_name: norte-postgres
    environment:
      POSTGRES_DB: norte
      POSTGRES_USER: norte
      POSTGRES_PASSWORD: ${DB_PASSWORD:-norte}
    ports:
      - "5432:5432"
    volumes:
      - norte_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # A API so sobe depois que o banco aceita conexao de verdade; depender apenas de
      # "container iniciado" faz o Flyway falhar em metade das subidas.
      test: ["CMD-SHELL", "pg_isready -U norte -d norte"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  norte-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: norte-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/norte
      DB_USER: norte
      DB_PASSWORD: ${DB_PASSWORD:-norte}
      # Obrigatorio em producao. O default local existe so para o compose subir sem setup.
      JWT_SECRET: ${JWT_SECRET:-desenvolvimento-local-norte-api-segredo-hmac-256-bits}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  norte-web:
    build:
      context: ../norte-web
      dockerfile: Dockerfile
    container_name: norte-web
    depends_on:
      norte-api:
        condition: service_healthy
    ports:
      # Mesma porta do ng serve, para a origem permitida no CORS valer nos dois modos.
      - "4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  norte_postgres_data:
