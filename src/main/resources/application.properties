spring.application.name=norte-api

# Banco: valores default servem ao docker-compose local; sobrescreva por variavel de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/norte}
spring.datasource.username=${DB_USER:norte}
spring.datasource.password=${DB_PASSWORD:norte}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# RFC 7807 tambem para os erros que o proprio Spring MVC levanta.
spring.mvc.problemdetails.enabled=true

# Segredo HMAC do JWT. O default existe apenas para o ambiente de desenvolvimento local;
# em qualquer outro ambiente defina JWT_SECRET (minimo de 32 caracteres, exigencia do HS256).
norte.security.jwt.secret=${JWT_SECRET:desenvolvimento-local-norte-api-segredo-hmac-256-bits}
norte.security.jwt.issuer=norte-api
norte.security.jwt.expiration=${JWT_EXPIRATION:PT12H}

# Quantidade minima de questoes respondidas para concluir um assessment.
norte.assessment.minimum-answers=${ASSESSMENT_MIN_ANSWERS:8}

norte.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
